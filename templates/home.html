{% extends 'base.html' %}
{% block content %}
<h2>Categories</h2>
<ul>
{% for category in categories %}
<li>{{ category.name }}</li>
{% endfor %}
</ul>
<hr>
<h2>Products</h2>
{% for product in products %}
<div>
<h3>
    <a href="{% url 'product_detail' product.slug%}">{{ product.name }}</a>
    </h3>
<p>{{ product.description }}</p>
<p>₹{{ product.price }}</p>
<img src="{{ product.image.url }}" width="250">
</div>
<hr>
{% endfor %}
{% endblock %}
